# Compila el ejecutable de Windows (.exe) y lo publica como release de GitHub.
# Se lanza al subir una etiqueta de versión (p. ej. `git tag v1.0.0 && git push origin v1.0.0`)
# o a mano desde la pestaña Actions indicando la etiqueta.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la release (p. ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias (servidor, web, escritorio)
        run: |
          npm ci --omit=dev
          npm --prefix web ci
          npm --prefix desktop ci

      - name: Compilar el frontend
        run: npm run build

      - name: Empaquetar el .exe (instalador + portable)
        run: npm --prefix desktop run build:win

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Draw2Quote ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/dist/Draw2Quote-Setup-*.exe
            desktop/dist/Draw2Quote-*-portable.exe
