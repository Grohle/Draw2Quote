<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Draw2Quote — del plano al presupuesto en segundos">
  <defs>
    <pattern id="fino" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1c2433" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="grueso" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#fino)"/>
      <path d="M80 0H0V80" fill="none" stroke="#1c2433" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#2f4f9e"/>
    </marker>
  </defs>

  <!-- papel -->
  <rect width="1280" height="420" fill="#f3f1ea"/>
  <rect width="1280" height="420" fill="url(#grueso)"/>
  <rect x="14" y="14" width="1252" height="392" fill="none" stroke="#1c2433" stroke-width="3"/>
  <rect x="22" y="22" width="1236" height="376" fill="none" stroke="#1c2433" stroke-width="1"/>

  <!-- barra superior -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15" letter-spacing="2" fill="#1c2433">
    <text x="48" y="58" font-weight="600">DRAW2QUOTE</text>
    <text x="640" y="58" text-anchor="middle">DATA + AI · DWG Nº D2Q-001</text>
    <text x="1232" y="58" text-anchor="end">ES · EN</text>
  </g>
  <line x1="40" y1="76" x2="1240" y2="76" stroke="#1c2433" stroke-width="2"/>

  <!-- título -->
  <g font-family="'Fira Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#1c2433">
    <text x="48" y="126" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="15" letter-spacing="2" fill="#c4401a">v1.0.0 · CLAUDE API · OLLAMA · LM STUDIO · vLLM</text>
    <text x="44" y="224" font-size="104" font-weight="700" letter-spacing="-4">Draw2Quote</text>
    <text x="48" y="276" font-size="30">Del plano al presupuesto en segundos.</text>
    <text x="48" y="312" font-size="20" fill="#5d6472">From drawing to quote in seconds.</text>
  </g>

  <!-- chips de confianza -->
  <g font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="13" letter-spacing="1.5">
    <rect x="48" y="340" width="70" height="26" fill="#f3f1ea" stroke="#2e7a4c"/>
    <text x="83" y="358" text-anchor="middle" fill="#2e7a4c">ALTA</text>
    <rect x="128" y="340" width="78" height="26" fill="#f3f1ea" stroke="#a16207"/>
    <text x="167" y="358" text-anchor="middle" fill="#a16207">MEDIA</text>
    <rect x="216" y="340" width="66" height="26" fill="#f3f1ea" stroke="#b42318"/>
    <text x="249" y="358" text-anchor="middle" fill="#b42318">BAJA</text>
    <rect x="292" y="340" width="128" height="26" fill="#1c2433"/>
    <text x="356" y="358" text-anchor="middle" fill="#f3f1ea">AI-REVIEWED</text>
  </g>

  <!-- dibujo: perfil en U acotado -->
  <g transform="translate(700 108)">
    <rect x="0" y="0" width="532" height="270" fill="#fbfaf6" stroke="#1c2433" stroke-width="2"/>
    <g fill="none" stroke="#1c2433" stroke-width="3" stroke-linejoin="miter">
      <path d="M40 60 V190 H200 V60"/>
      <path d="M52 60 V178 H188 V60"/>
    </g>
    <g font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#2f4f9e">
      <!-- cota inferior -->
      <line x1="52" y1="214" x2="188" y2="214" stroke="#2f4f9e" stroke-width="1.2" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
      <line x1="52" y1="194" x2="52" y2="222" stroke="#2f4f9e" stroke-width="1"/>
      <line x1="188" y1="194" x2="188" y2="222" stroke="#2f4f9e" stroke-width="1"/>
      <text x="120" y="236" text-anchor="middle">46</text>
      <!-- cota lateral -->
      <line x1="18" y1="60" x2="18" y2="190" stroke="#2f4f9e" stroke-width="1.2" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
      <text x="12" y="130" text-anchor="end" transform="rotate(-90 12 130)" dy="-4">25</text>
      <text x="64" y="48">e = 2</text>
      <text x="120" y="160" text-anchor="middle" fill="#c4401a">Ri = ?</text>
    </g>
    <!-- vista en planta con taladros -->
    <g transform="translate(250 40)">
      <rect x="0" y="0" width="160" height="96" fill="none" stroke="#1c2433" stroke-width="2.5"/>
      <line x1="0" y1="14" x2="160" y2="14" stroke="#1c2433" stroke-width="1" stroke-dasharray="6 4"/>
      <g fill="none" stroke="#1c2433" stroke-width="2">
        <circle cx="26" cy="38" r="7"/><circle cx="134" cy="38" r="7"/>
        <circle cx="26" cy="74" r="7"/><circle cx="134" cy="74" r="7"/>
      </g>
      <text x="160" y="-10" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="13" fill="#2f4f9e">4× Ø6.5</text>
    </g>
    <!-- cajetín -->
    <g transform="translate(332 160)" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="12" fill="#1c2433">
      <rect x="0" y="0" width="200" height="110" fill="#fbfaf6" stroke="#1c2433" stroke-width="1.5"/>
      <line x1="0" y1="27.5" x2="200" y2="27.5" stroke="#1c2433"/>
      <line x1="0" y1="55" x2="200" y2="55" stroke="#1c2433"/>
      <line x1="0" y1="82.5" x2="200" y2="82.5" stroke="#1c2433"/>
      <line x1="84" y1="0" x2="84" y2="110" stroke="#1c2433"/>
      <text x="10" y="19">PLANO</text><text x="94" y="19">D2Q-001</text>
      <text x="10" y="46">MAT.</text><text x="94" y="46">AISI 304</text>
      <text x="10" y="74">CANT.</text><text x="94" y="74">25</text>
      <text x="10" y="101">QUOTE</text><text x="94" y="101" fill="#c4401a" font-weight="600">20,95 €</text>
    </g>
  </g>
</svg>
